
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="400"
     viewBox="0 0 1200 400"
     role="img"
     aria-labelledby="title description">
  <title id="title">Neighborhood Home Services demo banner</title>
  <desc id="description">
    Illustrated houses with a promotional message for a fictional home services business.
  </desc>

  <rect width="1200" height="400" fill="#17324D"/>

  <circle cx="1030" cy="90" r="55" fill="#F6C453"/>

  <path d="M780 260 L920 140 L1060 260"
        fill="none" stroke="#FFFFFF"
        stroke-width="20"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <rect x="820" y="260" width="200" height="110"
        rx="8" fill="#8EC5D6"/>

  <rect x="895" y="295" width="50" height="75"
        fill="#17324D"/>

  <text x="65" y="85"
        fill="#F6C453"
        font-family="Arial, sans-serif"
        font-size="25" font-weight="bold">
    DEMONSTRATION SPONSOR
  </text>

  <text x="65" y="160"
        fill="#FFFFFF"
        font-family="Arial, sans-serif"
        font-size="46" font-weight="bold">
    Neighborhood Home Services
  </text>

  <text x="65" y="220"
        fill="#D7E7F0"
        font-family="Arial, sans-serif"
        font-size="27">
    Helping local residents with home service needs
  </text>

  <text x="65" y="345"
        fill="#F6C453"
        font-family="Arial, sans-serif"
        font-size="20">
    Sample advertisement — not a real business endorsement
  </text>
</svg>
